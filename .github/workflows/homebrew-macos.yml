name: Homebrew macOS validation

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - "dist/**"
      - ".github/workflows/homebrew-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Show platform
        run: |
          sw_vers
          uname -m
          brew --version
      - name: Add DDRimage tap
        run: brew tap amiba-xqq/ddrimage https://github.com/amiba-xqq/DDRimage
      - name: Install DDRimage formula
        run: brew install --build-from-source amiba-xqq/ddrimage/ddrimage
      - name: Verify runtime and source
        run: |
          prefix="$(brew --prefix ddrimage)"
          python="$prefix/libexec/environment/bin/python"
          "$python" -m py_compile "$prefix/libexec/app/main.py" "$prefix/libexec/app/runner.py" "$prefix"/libexec/app/analysis/*.py
          "$python" -c "import PySide6,numpy,scipy,pandas,matplotlib,PIL,tifffile,skimage,cv2,liffile; print('DDRimage Homebrew runtime OK')"
      - name: Run formula test
        run: brew test amiba-xqq/ddrimage/ddrimage

